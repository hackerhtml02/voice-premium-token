name: Extract Token & Auto Restart

on:
  workflow_dispatch:   # manual trigger only

permissions:
  contents: write

jobs:
  run_and_restart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install selenium selenium-wire webdriver-manager

      - name: Run scraper
        run: python scrape_token.py

      - name: Commit updated token
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          if [[ -n $(git status --porcelain) ]]; then
            git add token.txt
            git commit -m "Updated token at $(date)"
            git push
          fi

      - name: Wait 10 minutes
        run: sleep 600   # 600 seconds = 10 min

      - name: Restart workflow via API
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/$REPO/actions/workflows/extract_token.yml/dispatches \
            -d '{"ref":"main"}'
