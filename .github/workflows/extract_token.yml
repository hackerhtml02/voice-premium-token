name: Extract Token & Auto Restart

on:
  workflow_dispatch:    # Start manually only (no schedule)

permissions:
  contents: write

jobs:
  run_and_restart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Selenium + Fix Dependencies
        run: |
          pip install blinker==1.4
          pip install mitmproxy==8.1.1
          pip install selenium-wire
          pip install selenium webdriver-manager

      - name: Run scraper
        run: python scrape_token.py

      - name: Commit token if updated
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          if [[ -n $(git status --porcelain) ]]; then
            git add token.txt
            git commit -m "Updated token at $(date)"
            git push
          else
            echo "No changes."
          fi

      - name: Wait 10 minutes
        run: sleep 600

      - name: Restart workflow automatically
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.ACTIONS_TRIGGER_TOKEN }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/$REPO/actions/workflows/extract_token.yml/dispatches \
            -d '{"ref":"main"}'
